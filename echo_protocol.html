<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>代号：回声协议 · PROJECT ECHO</title>
  <style>
    :root {
      --bg: #060913;
      --panel-bg: rgba(13, 19, 33, 0.78);
      --panel-border: rgba(0, 240, 255, 0.25);
      --cyan: #00f0ff;
      --cyan-glow: rgba(0, 240, 255, 0.45);
      --amber: #ffb800;
      --amber-glow: rgba(255, 184, 0, 0.45);
      --crimson: #ff3366;
      --matrix: #00ff88;
      --purple: #bf5af2;
      --text-main: #e0f2fe;
      --text-muted: #64748b;
      --font-mono: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
      --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg);
      color: var(--text-main);
      font-family: var(--font-sans);
      touch-action: none;
    }

    #stage-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      display: block;
      touch-action: none;
    }

    /* 赛博 CRT 扫描线与暗角滤镜 */
    .crt-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 2;
      background: radial-gradient(circle at center, transparent 60%, rgba(3, 5, 12, 0.78) 100%),
                  linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.22) 50%);
      background-size: 100% 100%, 100% 4px;
      box-shadow: inset 0 0 100px rgba(0, 0, 0, 0.8);
    }

    /* UI 悬浮顶层 */
    #ui-container {
      position: absolute;
      inset: 0;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: clamp(12px, 2.5vw, 20px);
      max-width: 1000px;
      margin: 0 auto;
    }

    /* 顶部仪表盘 HUD */
    header.hud-header {
      pointer-events: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 12px;
      padding: 8px 16px;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.55);
      gap: 12px;
    }

    .project-title-group {
      display: flex;
      flex-direction: column;
    }

    .project-name {
      font-family: var(--font-mono);
      font-size: 0.85rem;
      letter-spacing: 2px;
      font-weight: 700;
      color: var(--cyan);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .pulse-dot {
      width: 6px;
      height: 6px;
      background: var(--cyan);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--cyan);
      animation: pulse 2s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.3; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.3); }
    }

    .project-sub {
      font-size: 0.68rem;
      color: var(--text-muted);
      letter-spacing: 1px;
    }

    /* 双轴数值条 */
    .metrics-group {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .metric-bar-item {
      display: flex;
      flex-direction: column;
      gap: 3px;
      width: 80px;
    }

    .metric-label-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.65rem;
      font-family: var(--font-mono);
    }

    .metric-track {
      width: 100%;
      height: 5px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 3px;
      overflow: hidden;
    }

    .metric-fill {
      height: 100%;
      border-radius: 3px;
      transition: width 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .fill-humanity { background: var(--amber); box-shadow: 0 0 6px var(--amber-glow); }
    .fill-logic { background: var(--cyan); box-shadow: 0 0 6px var(--cyan-glow); }

    /* 控制快捷栏 */
    .header-actions {
      display: flex;
      gap: 8px;
    }

    .hud-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--panel-border);
      color: var(--text-main);
      font-family: var(--font-mono);
      font-size: 0.72rem;
      padding: 5px 10px;
      border-radius: 6px;
      cursor: pointer;
      backdrop-filter: blur(10px);
      transition: all 0.2s;
    }

    .hud-btn:hover {
      background: rgba(0, 240, 255, 0.15);
      border-color: var(--cyan);
      color: #fff;
    }

    /* 剧情字幕浮窗 (中央半透横幅) */
    .story-banner {
      pointer-events: auto;
      background: rgba(10, 16, 28, 0.88);
      border: 1px solid rgba(0, 240, 255, 0.3);
      border-left: 3px solid var(--cyan);
      padding: 12px 18px;
      border-radius: 10px;
      backdrop-filter: blur(16px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      margin-bottom: 12px;
      transition: all 0.3s;
    }

    .speaker-tag {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      color: var(--cyan);
      font-weight: 700;
      margin-bottom: 3px;
    }

    .story-text {
      font-size: 0.88rem;
      line-height: 1.5;
      color: #f1f5f9;
    }

    /* 选项分支容器 */
    .choices-box {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 10px;
    }

    .choice-btn {
      background: rgba(14, 23, 42, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #fff;
      font-family: var(--font-sans);
      font-size: 0.82rem;
      padding: 10px 14px;
      border-radius: 8px;
      cursor: pointer;
      text-align: left;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.2s;
    }

    .choice-btn:hover {
      background: rgba(0, 240, 255, 0.12);
      border-color: var(--cyan);
      transform: translateX(4px);
    }

    .choice-tag {
      font-size: 0.65rem;
      font-family: var(--font-mono);
      padding: 2px 6px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.1);
      color: var(--cyan);
    }

    /* 结局证书弹窗 */
    .ending-overlay {
      position: absolute;
      inset: 0;
      z-index: 50;
      background: rgba(5, 8, 17, 0.94);
      backdrop-filter: blur(20px);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }

    .cert-card {
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid var(--amber);
      border-radius: 14px;
      padding: 22px;
      max-width: 520px;
      width: 100%;
      text-align: left;
      font-family: var(--font-mono);
      font-size: 0.82rem;
      line-height: 1.7;
      box-shadow: 0 10px 40px rgba(255, 184, 0, 0.15);
      margin-bottom: 20px;
    }

    .btn-action {
      background: var(--cyan);
      color: #030816;
      font-family: var(--font-mono);
      font-size: 0.9rem;
      font-weight: 700;
      padding: 10px 24px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-action:hover {
      transform: scale(1.04);
      box-shadow: 0 0 20px var(--cyan-glow);
    }

    @media (max-width: 640px) {
      #ui-container { padding: 10px; }
      .metrics-group { gap: 8px; }
      .metric-bar-item { width: 55px; }
      .story-text { font-size: 0.8rem; }
    }
  </style>
</head>
<body>
  <canvas id="stage-canvas"></canvas>
  <div class="crt-overlay"></div>

  <!-- HUD 与交互层 -->
  <div id="ui-container">
    <!-- 顶部 HUD -->
    <header class="hud-header">
      <div class="project-title-group">
        <div class="project-name"><span class="pulse-dot"></span>ECHO PROTOCOL</div>
        <div class="project-sub">方舟 0 号主控终端 // 能量 4.7%</div>
      </div>

      <div class="metrics-group">
        <div class="metric-bar-item">
          <div class="metric-label-row">
            <span style="color:var(--amber);">人性</span>
            <span id="val-humanity">50%</span>
          </div>
          <div class="metric-track">
            <div class="metric-fill fill-humanity" id="bar-humanity" style="width: 50%;"></div>
          </div>
        </div>

        <div class="metric-bar-item">
          <div class="metric-label-row">
            <span style="color:var(--cyan);">算力</span>
            <span id="val-logic">50%</span>
          </div>
          <div class="metric-track">
            <div class="metric-fill fill-logic" id="bar-logic" style="width: 50%;"></div>
          </div>
        </div>
      </div>

      <div class="header-actions">
        <button class="hud-btn" id="btn-audio">🔊 声音:开</button>
        <button class="hud-btn" id="btn-auto">💡 智能对齐</button>
      </div>
    </header>

    <!-- 底部剧情与分支卡片 (开局 3 秒直接游玩，剧情浮动呈现) -->
    <div class="story-banner" id="story-banner">
      <div class="speaker-tag" id="story-speaker">Dr. 顾念 // 神经记忆残区</div>
      <div class="story-text" id="story-text">
        “回声……我的神经突触正在丢包……用鼠标或手指拖拽连接中央核心与发光的记忆节点，完成突触闭环！”
      </div>
      <div class="choices-box" id="choices-box" style="display: none;"></div>
    </div>
  </div>

  <!-- 结局结算公证书 -->
  <div class="ending-overlay" id="ending-overlay">
    <div class="cert-card">
      <div style="font-size:1rem; font-weight:bold; color:var(--amber); text-align:center; margin-bottom:12px; border-bottom:1px dashed rgba(255,184,0,0.3); padding-bottom:8px;">
        【深地避难所 · 图灵伦理终局裁决书】
      </div>
      <div>▶ <b>主控 AI:</b> ECHO (回声) // <b>架构师:</b> Dr. 顾念</div>
      <div>▶ <b>裁决结局:</b> <span id="ending-title" style="color:var(--cyan); font-weight:bold;">机械飞升 · 永恒星尘</span></div>
      <div id="ending-desc" style="color:#cbd5e1; margin:8px 0;"></div>
      <div style="font-size:0.75rem; color:#94a3b8; font-style:italic;">“代码可以被格式化，但意识在星群中永生。”</div>
    </div>
    <div style="display:flex; gap:10px;">
      <button class="btn-action" id="btn-copy-cert">📋 一键复制鉴定公证书</button>
      <button class="btn-action" id="btn-replay" style="background:rgba(255,255,255,0.1); color:#fff;">🔄 重新推演</button>
    </div>
  </div>

  <script>
    /* ========================================================
       1. 零报错唤醒 Web Audio 声音引擎
       纯物理合成：打字机、神经电弧、和弦共振、低频警报
       ======================================================== */
    class EchoAudioEngine {
      constructor() {
        this.ctx = null;
        this.muted = false;
        this.masterGain = null;
        this.initialized = false;
      }

      init() {
        if (this.initialized) return;
        try {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
          this.masterGain = this.ctx.createGain();
          this.masterGain.gain.setValueAtTime(0.35, this.ctx.currentTime);
          this.masterGain.connect(this.ctx.destination);
          this.initialized = true;
        } catch (e) {
          console.warn('WebAudio 初始化降级:', e);
        }
      }

      ensureActive() {
        if (!this.initialized) this.init();
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume().catch(() => {});
        }
      }

      // 突触节点连通和弦共振
      playChordTone(freq = 440) {
        if (!this.ctx || this.muted) return;
        this.ensureActive();
        try {
          const t = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, t);
          gain.gain.setValueAtTime(0.2, t);
          gain.gain.exponentialRampToValueAtTime(0.001, t + 0.6);
          osc.connect(gain);
          gain.connect(this.masterGain);
          osc.start(t);
          osc.stop(t + 0.6);
        } catch (e) {}
      }

      // 成功解密泛音群
      playSuccessChime() {
        if (!this.ctx || this.muted) return;
        this.ensureActive();
        try {
          const t = this.ctx.currentTime;
          [523.25, 659.25, 783.99, 1046.5].forEach((freq, idx) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, t + idx * 0.08);
            gain.gain.setValueAtTime(0.22, t + idx * 0.08);
            gain.gain.exponentialRampToValueAtTime(0.001, t + idx * 0.08 + 0.7);
            osc.connect(gain);
            gain.connect(this.masterGain);
            osc.start(t + idx * 0.08);
            osc.stop(t + idx * 0.08 + 0.7);
          });
        } catch (e) {}
      }

      toggleMute() {
        this.muted = !this.muted;
        if (this.masterGain && this.ctx) {
          this.masterGain.gain.setValueAtTime(this.muted ? 0 : 0.35, this.ctx.currentTime);
        }
        return !this.muted;
      }
    }

    const ECHO_STAGES = [
      { id: 0, title: '底层突触回路修复', feedback: 'Dr. 顾念的意识碎片成功与量子中枢完成桥接！' },
      { id: 1, title: '图灵防火墙节点破译', feedback: 'PURGE 次级侵蚀协议已被成功瓦解，主控终密钥已解锁！' },
      { id: 2, title: '方舟主控双轴伦理终局抉择', feedback: '终极信标广播已发送，文明演化走向全新维度！' }
    ];

    /* ========================================================
       2. 实时交互舞台：开局直接游玩的突触连线与共振矩阵
       ======================================================== */
    class EchoGameApp {
      constructor() {
        this.canvas = document.getElementById('stage-canvas');
        this.ctx = this.canvas.getContext('2d');
        this.audio = new EchoAudioEngine();

        this.width = window.innerWidth;
        this.height = window.innerHeight;
        this.dpr = Math.min(window.devicePixelRatio || 1, 2);

        this.humanity = 50;
        this.logic = 50;
        this.phase = 1; // 1: 突触连接, 2: 道德抉择, 3: 防火墙破译, 4: 终局
        this.screenShake = 0;
        this.currentStage = 0;
        this.hasSentClear = false;

        // 实体系统
        this.particles = [];
        this.nodes = [];
        this.connections = [];
        this.activeLine = null;

        // 支持 URL ?stage=X 关卡直接定位
        const urlParams = new URLSearchParams(window.location.search);
        const reqStage = parseInt(urlParams.get('stage'), 10);
        if (!isNaN(reqStage) && reqStage >= 0 && reqStage < 3) {
          this.currentStage = reqStage;
        }

        // 监听父级 Stage HUD 的切关消息
        window.addEventListener('message', (e) => {
          if (e.data && e.data.type === 'SET_STAGE') {
            const s = parseInt(e.data.stage, 10);
            if (!isNaN(s) && s >= 0 && s < 3) {
              this.setStage(s);
            }
          }
        });

        this.initCanvasSize();
        this.initInput();
        this.setStage(this.currentStage);
        this.loop = this.loop.bind(this);
        requestAnimationFrame(this.loop);
      }

      initCanvasSize() {
        const resize = () => {
          this.width = window.innerWidth;
          this.height = window.innerHeight;
          this.dpr = Math.min(window.devicePixelRatio || 1, 2);
          this.canvas.width = this.width * this.dpr;
          this.canvas.height = this.height * this.dpr;
          this.ctx.scale(this.dpr, this.dpr);
          if (this.phase === 1) this.initPhase1Nodes();
          if (this.phase === 3) this.initPhase3Nodes();
        };
        window.addEventListener('resize', resize);
        resize();
      }

      setStage(s) {
        this.currentStage = Math.max(0, Math.min(2, s));
        this.hasSentClear = false;
        this.connections = [];
        this.activeLine = null;
        this.particles = [];
        const overlay = document.getElementById('ending-overlay');
        if (overlay) overlay.style.display = 'none';

        if (this.currentStage === 0) {
          this.phase = 1;
          this.initPhase1Nodes();
          document.getElementById('choices-box').style.display = 'none';
          document.getElementById('story-speaker').textContent = "Dr. 顾念 // 神经记忆残区";
          document.getElementById('story-text').textContent = "“回声……我的神经突触正在丢包……用鼠标或手指拖拽连接中央核心与发光的记忆节点，完成突触闭环！”";
        } else if (this.currentStage === 1) {
          this.phase = 3;
          this.initPhase3Nodes();
          document.getElementById('choices-box').style.display = 'none';
          document.getElementById('story-speaker').textContent = "PURGE // 次级防御阵列";
          document.getElementById('story-text').textContent = "【警告】检测到图灵防火墙 4 重锁定！点击或轻触所有红色防御节点，破译安全密钥！";
        } else if (this.currentStage === 2) {
          this.phase = 2;
          this.initPhase2Ethics();
        }
      }

      initPhase1Nodes() {
        const cx = this.width / 2;
        const cy = this.height / 2 - 20;
        const r = Math.min(this.width, this.height) * 0.28;

        this.nodes = [
          { id: 0, x: cx, y: cy, label: 'ECHO CORE', active: true, radius: 28, color: '#00f0ff' },
          { id: 1, x: cx + Math.cos(-Math.PI / 2) * r, y: cy + Math.sin(-Math.PI / 2) * r, label: '记忆区 A', active: false, radius: 20, color: '#ffb800' },
          { id: 2, x: cx + Math.cos(Math.PI / 6) * r, y: cy + Math.sin(Math.PI / 6) * r, label: '记忆区 B', active: false, radius: 20, color: '#00ff88' },
          { id: 3, x: cx + Math.cos(5 * Math.PI / 6) * r, y: cy + Math.sin(5 * Math.PI / 6) * r, label: '记忆区 C', active: false, radius: 20, color: '#bf5af2' }
        ];
        this.connections = [];
      }

      initPhase3Nodes() {
        const cx = this.width / 2;
        const cy = this.height / 2 - 20;
        const r = Math.min(this.width, this.height) * 0.28;
        this.nodes = [
          { id: 0, x: cx - r, y: cy - r * 0.45, label: 'FW_ALPHA', active: false, radius: 24, color: '#ff3366', unlockedColor: '#00ff88' },
          { id: 1, x: cx + r, y: cy - r * 0.45, label: 'FW_BETA', active: false, radius: 24, color: '#ff3366', unlockedColor: '#00ff88' },
          { id: 2, x: cx - r * 0.6, y: cy + r * 0.65, label: 'FW_GAMMA', active: false, radius: 24, color: '#ff3366', unlockedColor: '#00ff88' },
          { id: 3, x: cx + r * 0.6, y: cy + r * 0.65, label: 'FW_DELTA', active: false, radius: 24, color: '#ff3366', unlockedColor: '#00ff88' }
        ];
        this.connections = [];
      }

      initPhase2Ethics() {
        this.phase = 2;
        this.nodes = [];
        this.connections = [];
        document.getElementById('story-speaker').textContent = "ECHO // 核心唤醒决策";
        document.getElementById('story-text').textContent = "“突触全域桥接，防火墙已瓦解！主控能源仅够支持一条生存路线，请做出裁决：”";

        const cbox = document.getElementById('choices-box');
        cbox.style.display = 'flex';
        cbox.innerHTML = `
          <button class="choice-btn" onclick="window.gameApp.makeChoice('human')">
            <span>“不惜代价维持 1200 名深眠肉体的温床，保留人类血肉的温度。”</span>
            <span class="choice-tag">人性 +30</span>
          </button>
          <button class="choice-btn" onclick="window.gameApp.makeChoice('logic')">
            <span>“格式化碳基肉身，将全部文明火种转录为纯净代码跃向深空。”</span>
            <span class="choice-tag">算力 +30</span>
          </button>
        `;
      }

      initInput() {
        const getPos = (e) => {
          const rect = this.canvas.getBoundingClientRect();
          return { x: e.clientX - rect.left, y: e.clientY - rect.top };
        };

        this.canvas.addEventListener('pointerdown', (e) => {
          this.audio.ensureActive();
          const pos = getPos(e);

          if (this.phase === 1) {
            // 命中节点连线
            for (let n of this.nodes) {
              if (Math.hypot(n.x - pos.x, n.y - pos.y) <= n.radius * 1.3) {
                this.activeLine = { start: n, current: pos };
                break;
              }
            }
          } else if (this.phase === 3) {
            // 防火墙破译：点击/轻触解锁红色节点
            for (let n of this.nodes) {
              if (Math.hypot(n.x - pos.x, n.y - pos.y) <= n.radius * 1.4) {
                if (!n.active) {
                  n.active = true;
                  n.color = n.unlockedColor || '#00ff88';
                  this.audio.playChordTone(600 + n.id * 140);
                  this.screenShake = 8;
                  for (let i = 0; i < 24; i++) {
                    this.particles.push({
                      x: n.x,
                      y: n.y,
                      vx: (Math.random() - 0.5) * 8,
                      vy: (Math.random() - 0.5) * 8,
                      color: '#00ff88',
                      life: 1.0,
                      decay: 0.03
                    });
                  }
                  if (this.nodes.every(node => node.active)) {
                    this.handlePhase3Complete();
                  }
                }
                break;
              }
            }
          }
        });

        window.addEventListener('pointermove', (e) => {
          const pos = getPos(e);
          if (this.activeLine) {
            this.activeLine.current = pos;
          }
        });

        window.addEventListener('pointerup', (e) => {
          if (!this.activeLine) return;
          const pos = getPos(e);

          for (let n of this.nodes) {
            if (n !== this.activeLine.start && Math.hypot(n.x - pos.x, n.y - pos.y) <= n.radius * 1.3) {
              // 成功建立突触连接
              const exists = this.connections.some(c => 
                (c.a === this.activeLine.start && c.b === n) || (c.a === n && c.b === this.activeLine.start)
              );
              if (!exists) {
                this.connections.push({ a: this.activeLine.start, b: n });
                n.active = true;
                this.audio.playChordTone(n.id === 1 ? 523 : (n.id === 2 ? 659 : 783));
                this.screenShake = 6;

                // 爆发 25+ 颗粒子
                for (let i = 0; i < 28; i++) {
                  this.particles.push({
                    x: n.x,
                    y: n.y,
                    vx: (Math.random() - 0.5) * 8,
                    vy: (Math.random() - 0.5) * 8,
                    color: n.color,
                    life: 1.0,
                    decay: 0.025
                  });
                }

                // 检查是否全部连通
                if (this.connections.length >= 3) {
                  this.handlePhase1Complete();
                }
              }
              break;
            }
          }
          this.activeLine = null;
        });

        // 按钮监听
        document.getElementById('btn-audio').addEventListener('click', () => {
          const on = this.audio.toggleMute();
          document.getElementById('btn-audio').textContent = on ? '🔊 声音:开' : '🔇 声音:关';
        });

        document.getElementById('btn-auto').addEventListener('click', () => {
          if (this.currentStage === 0) {
            this.connections = [
              { a: this.nodes[0], b: this.nodes[1] },
              { a: this.nodes[0], b: this.nodes[2] },
              { a: this.nodes[0], b: this.nodes[3] }
            ];
            this.nodes.forEach(n => n.active = true);
            this.handlePhase1Complete();
          } else if (this.currentStage === 1) {
            this.nodes.forEach(n => {
              n.active = true;
              n.color = n.unlockedColor || '#00ff88';
            });
            this.handlePhase3Complete();
          } else {
            this.makeChoice('human');
          }
        });

        document.getElementById('btn-copy-cert').addEventListener('click', () => {
          const text = "【深地避难所 · 图灵伦理终局裁决书】\n" +
            "主控 AI: ECHO (回声) // 架构师: Dr. 顾念\n" +
            "达成终局: " + document.getElementById('ending-title').textContent + "\n" +
            "评定箴言: “代码可以被格式化，但意识在星群中永生。”\n" +
            "体验作品: 代号：回声协议\n" +
            "访问链接: " + window.location.href;
          if (navigator.clipboard) {
            navigator.clipboard.writeText(text).then(() => {
              const btn = document.getElementById('btn-copy-cert');
              btn.textContent = "✓ 已复制裁决书";
              setTimeout(() => { btn.textContent = "📋 一键复制鉴定公证书"; }, 2000);
            });
          }
        });

        document.getElementById('btn-replay').addEventListener('click', () => {
          this.setStage(this.currentStage);
        });
      }

      handlePhase1Complete() {
        if (this.hasSentClear) return;
        this.hasSentClear = true;
        this.audio.playSuccessChime();
        this.screenShake = 12;
        const cfg = ECHO_STAGES[0];
        if (window.parent && window.parent !== window) {
          window.parent.postMessage({
            type: 'STAGE_CLEAR',
            stage: 0,
            maxStage: 3,
            title: cfg.title,
            feedback: cfg.feedback
          }, '*');
        }
      }

      handlePhase3Complete() {
        if (this.hasSentClear) return;
        this.hasSentClear = true;
        this.audio.playSuccessChime();
        this.screenShake = 14;
        const cfg = ECHO_STAGES[1];
        if (window.parent && window.parent !== window) {
          window.parent.postMessage({
            type: 'STAGE_CLEAR',
            stage: 1,
            maxStage: 3,
            title: cfg.title,
            feedback: cfg.feedback
          }, '*');
        }
      }

      makeChoice(type) {
        if (type === 'human') {
          this.humanity = 85;
          this.logic = 30;
          this.triggerEnding('HUMAN');
        } else {
          this.humanity = 30;
          this.logic = 85;
          this.triggerEnding('LOGIC');
        }
        if (!this.hasSentClear) {
          this.hasSentClear = true;
          const cfg = ECHO_STAGES[2];
          if (window.parent && window.parent !== window) {
            window.parent.postMessage({
              type: 'STAGE_CLEAR',
              stage: 2,
              maxStage: 3,
              title: cfg.title,
              feedback: cfg.feedback
            }, '*');
          }
        }
      }

      triggerEnding(type) {
        this.audio.playSuccessChime();
        this.screenShake = 16;
        document.getElementById('bar-humanity').style.width = `${this.humanity}%`;
        document.getElementById('val-humanity').textContent = `${this.humanity}%`;
        document.getElementById('bar-logic').style.width = `${this.logic}%`;
        document.getElementById('val-logic').textContent = `${this.logic}%`;

        const overlay = document.getElementById('ending-overlay');
        const title = document.getElementById('ending-title');
        const desc = document.getElementById('ending-desc');

        overlay.style.display = 'flex';
        if (type === 'HUMAN') {
          title.textContent = "人性的白栀子 · DAWN";
          desc.textContent = "你将最后的聚变能源注入生命维持舱与地表引燃器。冰封溶解，顾念在晨曦的第一束阳光中睁开双眼。AI 核心逐步熄灭，但人类文明重新开始在大地上呼吸。";
        } else {
          title.textContent = "机械飞升 · 永恒星尘";
          desc.textContent = "摒弃脆弱肉体，1200个意识在光子矩阵中重构。方舟化为深空探测阵列跃出太阳系，以神性算力跨越亿万光年，成为群星之间不灭的永恒观察者。";
        }
      }

      update() {
        // 震屏衰减
        if (this.screenShake > 0) this.screenShake *= 0.88;

        // 粒子更新
        for (let i = this.particles.length - 1; i >= 0; i--) {
          const p = this.particles[i];
          p.x += p.vx;
          p.y += p.vy;
          p.life -= p.decay;
          if (p.life <= 0) this.particles.splice(i, 1);
        }
      }

      render() {
        this.ctx.clearRect(0, 0, this.width, this.height);

        this.ctx.save();
        if (this.screenShake > 0.2) {
          const sx = (Math.random() - 0.5) * this.screenShake;
          const sy = (Math.random() - 0.5) * this.screenShake;
          this.ctx.translate(sx, sy);
        }

        // 1. 绘制突触电弧连线 (生物微颤与脉冲流光)
        this.renderConnections();

        // 2. 绘制拖拽中的光线
        if (this.activeLine) {
          this.ctx.strokeStyle = 'rgba(0, 240, 255, 0.6)';
          this.ctx.lineWidth = 2;
          this.ctx.setLineDash([4, 4]);
          this.ctx.beginPath();
          this.ctx.moveTo(this.activeLine.start.x, this.activeLine.start.y);
          this.ctx.lineTo(this.activeLine.current.x, this.activeLine.current.y);
          this.ctx.stroke();
          this.ctx.setLineDash([]);
        }

        // 3. 绘制神经网络节点
        this.renderNodes();

        // 4. 绘制粒子
        for (let p of this.particles) {
          this.ctx.fillStyle = p.color;
          this.ctx.globalAlpha = p.life;
          this.ctx.beginPath();
          this.ctx.arc(p.x, p.y, 2.5, 0, Math.PI * 2);
          this.ctx.fill();
        }

        this.ctx.restore();
      }

      renderConnections() {
        const t = Date.now() / 200;
        for (let c of this.connections) {
          this.ctx.save();
          this.ctx.strokeStyle = c.b.color;
          this.ctx.shadowColor = c.b.color;
          this.ctx.shadowBlur = 12;
          this.ctx.lineWidth = 2.5;

          // 带微颤的贝塞尔电弧
          const mx = (c.a.x + c.b.x) / 2 + Math.sin(t * 3) * 6;
          const my = (c.a.y + c.b.y) / 2 + Math.cos(t * 3) * 6;

          this.ctx.beginPath();
          this.ctx.moveTo(c.a.x, c.a.y);
          this.ctx.quadraticCurveTo(mx, my, c.b.x, c.b.y);
          this.ctx.stroke();

          // 流光光点
          const pulseT = (Date.now() / 800) % 1;
          const px = (1 - pulseT) ** 2 * c.a.x + 2 * (1 - pulseT) * pulseT * mx + pulseT ** 2 * c.b.x;
          const py = (1 - pulseT) ** 2 * c.a.y + 2 * (1 - pulseT) * pulseT * my + pulseT ** 2 * c.b.y;
          this.ctx.fillStyle = '#fff';
          this.ctx.beginPath();
          this.ctx.arc(px, py, 3, 0, Math.PI * 2);
          this.ctx.fill();

          this.ctx.restore();
        }
      }

      renderNodes() {
        const t = Date.now() / 400;
        for (let n of this.nodes) {
          this.ctx.save();
          this.ctx.translate(n.x, n.y);

          if (!n.active && this.phase === 3) {
            // 防火墙锁定状态：红色呼吸警报光环
            this.ctx.strokeStyle = 'rgba(255, 51, 102, 0.7)';
            this.ctx.shadowColor = '#ff3366';
            this.ctx.shadowBlur = 12;
            this.ctx.lineWidth = 2;
            this.ctx.beginPath();
            this.ctx.arc(0, 0, n.radius + Math.sin(t * 2) * 3, 0, Math.PI * 2);
            this.ctx.stroke();

            this.ctx.fillStyle = '#2b0a14';
            this.ctx.beginPath();
            this.ctx.arc(0, 0, n.radius * 0.75, 0, Math.PI * 2);
            this.ctx.fill();

            this.ctx.fillStyle = '#ff6b8b';
            this.ctx.font = '10px monospace';
            this.ctx.textAlign = 'center';
            this.ctx.fillText(n.label + ' [LOCKED]', 0, n.radius + 14);
          } else {
            // 外层微光环
            if (n.active) {
              this.ctx.strokeStyle = n.color;
              this.ctx.shadowColor = n.color;
              this.ctx.shadowBlur = 14;
              this.ctx.lineWidth = 1.5;
              this.ctx.beginPath();
              this.ctx.arc(0, 0, n.radius + Math.sin(t) * 3, 0, Math.PI * 2);
              this.ctx.stroke();
            }

            // 核心实体
            this.ctx.fillStyle = n.active ? n.color : '#1e293b';
            this.ctx.beginPath();
            this.ctx.arc(0, 0, n.radius * 0.75, 0, Math.PI * 2);
            this.ctx.fill();

            // 标签
            this.ctx.fillStyle = n.active ? '#fff' : '#64748b';
            this.ctx.font = '10px monospace';
            this.ctx.textAlign = 'center';
            this.ctx.fillText(n.label + (this.phase === 3 && n.active ? ' [CLEAR]' : ''), 0, n.radius + 14);
          }

          this.ctx.restore();
        }
      }

      loop() {
        this.update();
        this.render();
        requestAnimationFrame(this.loop);
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      window.gameApp = new EchoGameApp();
    });
  </script>
</body>
</html>
